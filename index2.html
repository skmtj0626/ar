<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>AR.js Snowman Facing Camera</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-marker preset="hiro">
            <a-entity id="snowman" position="0 0 0" scale="0.5 0.5 0.5" rotation="-90 0 0">
                <a-sphere 
                    position="0 0.8 0" 
                    radius="0.8" 
                    color="white">
                </a-sphere>
                <a-sphere 
                    position="0 2.0 0" 
                    radius="0.5" 
                    color="white">
                </a-sphere>
                <a-sphere 
                    position="0.18 2.1 0.45" 
                    radius="0.06" 
                    color="black">
                </a-sphere>
                <a-sphere 
                    position="-0.18 2.1 0.45" 
                    radius="0.06" 
                    color="black">
                </a-sphere>
                <a-box 
                    position="0 1.85 0.45" 
                    width="0.25" 
                    height="0.05" 
                    depth="0.05" 
                    color="black">
                </a-box>
                <a-cone 
                    position="0 2.6 0" 
                    radius-top="0.1" 
                    radius-bottom="0.4" 
                    height="0.8" 
                    color="red">
                </a-cone>
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
