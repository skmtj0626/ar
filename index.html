<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>AR.js 3x3 Grid with Gaps</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam;">
        <a-marker preset="hiro">
            <a-box position="-1.1 0.4 -1.1" width="0.8" height="0.8" depth="0.8" color="skyblue"></a-box>
            <a-box position=" 0.0 0.4 -1.1" width="0.8" height="0.8" depth="0.8" color="red"></a-box>
            <a-box position=" 1.1 0.4 -1.1" width="0.8" height="0.8" depth="0.8" color="blue"></a-box>
            <a-box position="-1.1 0.4  0.0" width="0.8" height="0.8" depth="0.8" color="green"></a-box>
            <a-box position=" 0.0 0.4  0.0" width="0.8" height="0.8" depth="0.8" color="yellow"></a-box>
            <a-box position=" 1.1 0.4  0.0" width="0.8" height="0.8" depth="0.8" color="orange"></a-box>->
            <a-box position="-1.1 0.4  1.1" width="0.8" height="0.8" depth="0.8" color="pink"></a-box>
            <a-box position=" 0.0 0.4  1.1" width="0.8" height="0.8" depth="0.8" color="white"></a-box>
            <a-box position=" 1.1 0.4  1.1" width="0.8" height="0.8" depth="0.8" color="black"></a-box>
        </a-marker>

    <a-marker preset="kanji">
        <a-box position="-1.1 0.4 -1.1" width="0.8" height="0.8" depth="0.8" color="white"></a-box>
            <a-box position=" 0.0 0.4 -1.1" width="0.8" height="0.8" depth="0.8" color="white"></a-box>
            <a-box position=" 1.1 0.4 -1.1" width="0.8" height="0.8" depth="0.8" color="white"></a-box>
            <a-box position="-1.1 0.4  0.0" width="0.8" height="0.8" depth="0.8" color="white"></a-box>
            <a-box position=" 0.0 0.4  0.0" width="0.8" height="0.8" depth="0.8" color="red"></a-box>
            <a-box position=" 1.1 0.4  0.0" width="0.8" height="0.8" depth="0.8" color="white"></a-box>->
            <a-box position="-1.1 0.4  1.1" width="0.8" height="0.8" depth="0.8" color="white"></a-box>
            <a-box position=" 0.0 0.4  1.1" width="0.8" height="0.8" depth="0.8" color="white"></a-box>
            <a-box position=" 1.1 0.4  1.1" width="0.8" height="0.8" depth="0.8" color="white"></a-box>
    </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
